# ── Mouse & Scrollback ────────────────────────────────────────────────────
# Enable mouse support — scroll, click panes, resize, select windows
set -g mouse on

# Big scrollback buffer (default is 2000)
set -g history-limit 50000

# Make scrollwheel work naturally (enters copy mode, scrolls, exits on bottom)
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# ── Window Behavior ──────────────────────────────────────────────────────
# Always open new windows (not panes) for each new agent session
# Each claude session gets its own window to avoid cluttering panes
set -g default-command "${SHELL}"

# Number windows from 1 (not 0) for easier keyboard nav
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# New window inherits current working directory
bind c new-window -c "#{pane_current_path}"

# Don't auto-rename windows — keep the name we set on creation
setw -g automatic-rename off
set -g allow-rename off

# ── Session Defaults ─────────────────────────────────────────────────────
# Detach on destroy — when a session ends, detach instead of closing terminal
set -g detach-on-destroy on

# Status bar shows window names clearly
set -g status-left-length 30
set -g status-right-length 60

# ── Agent Lifecycle Hook ─────────────────────────────────────────────────
# Mark dead sessions in AgentTracker when any tmux session is closed
set-hook -g session-closed "run-shell '~/.venvs/global/bin/python ~/agent-dashboard/tracker/hooks/on_session_closed.py'"

# ── TPM (keep at bottom) ─────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
run '~/.tmux/plugins/tpm/tpm'
