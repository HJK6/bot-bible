Resources:
  # Lambda Functions for Agent Dashboard
  # Logical IDs must match existing stack resources to enable in-place update

  dashGetAgents:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dashGetAgents
      Handler: handlers.tracker.getAgentsHandler
      CodeUri:
        Bucket: "altum-deployment-assets"
        Key: "dashboard-handlers.zip"
        Version: !Ref HandlersVersion
      Role: !GetAtt DashboardLambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref AgentDashboardApi
            Path: /dashGetAgents
            Method: POST

  dashGetBots:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dashGetBots
